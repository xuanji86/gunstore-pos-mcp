[project]
name = "gunstore-mcp"
dynamic = ["version"]
description = "MCP server wrapping the GunStore-POS Frappe REST API for fast production ops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "requests>=2.31",
    "urllib3>=2",
    "python-dotenv>=1.0",
]

[project.scripts]
gunstore-mcp = "gunstore_mcp.server:main"

[tool.hatch.version]
path = "gunstore_mcp/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gunstore_mcp"]
